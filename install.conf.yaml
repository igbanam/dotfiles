- defaults:
    link:
      relink: true
      create: true

- clean: ['~', '~/.config']

- create:
    - ~/projects
    - ~/.config

- link:
    ~/.gitconfig: gitconfig
    ~/.gitignore-system: gitignore-system
    ~/.tmux.conf: tmux.conf
    ~/.vimrc: vimrc
    ~/.vim/vim.d: vim.d
    ~/.config/ghostty: ghostty

- shell:
    # Homebrew packages (works on macOS and Linux with Homebrew)
    -
      command: command -v brew >/dev/null 2>&1 && brew bundle --file=Brewfile || echo "Homebrew not found, skipping brew packages"
      description: Install Homebrew packages
      stdout: true
      stderr: true
    # Vim plugin manager
    -
      command: curl -fLo ~/.vim/autoload/plug.vim --create-dirs https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
      description: "Install vim-plug: Package Management for Vim"
    # Vim plugins
    -
      command: vim -es -u ~/.vimrc -i NONE -c "PlugInstall" -c "qa" || true
      description: Install Vim plugins
    # Shell configuration
    -
      command: grep -q "GIT_BASE_BRANCH" ~/.zprofile 2>/dev/null || echo 'export GIT_BASE_BRANCH=release' >> ~/.zprofile
      description: Set default Git branch to "release"
    # Modern CLI tool integrations
    -
      command: command -v zoxide >/dev/null 2>&1 && grep -q "zoxide init" ~/.zshrc 2>/dev/null || echo 'eval "$(zoxide init zsh)"' >> ~/.zshrc || true
      description: Initialize zoxide in zsh
    # Git maintenance
    -
      command: command -v git >/dev/null 2>&1 && git maintenance start || true
      description: Enable git background maintenance
